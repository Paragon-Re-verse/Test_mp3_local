name: Build test artifacts

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-player-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-player-windows-exe
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error

  publish-release:
    name: Publish test-build release
    needs: [build-android, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nocturne-player-android-apk
          path: dist/android

      - uses: actions/download-artifact@v4
        with:
          name: nocturne-player-windows-exe
          path: dist/windows

      - name: Package release assets
        run: |
          mkdir -p dist/release
          cp dist/android/*.apk dist/release/nocturne-player.apk
          cd dist/windows && zip -r ../release/nocturne-player-windows.zip . && cd -

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build (latest)
          prerelease: true
          body: >-
            Automatically rebuilt from the latest push to
            `${{ github.ref_name }}` (${{ github.sha }}). Debug-signed test
            binaries, not for production/store distribution.
          files: |
            dist/release/nocturne-player.apk
            dist/release/nocturne-player-windows.zip
